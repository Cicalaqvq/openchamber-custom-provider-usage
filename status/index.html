<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <title>OpenChamber Custom Provider Usage</title>
  </head>
  <body>
    <main id="root" aria-label="OpenChamber Custom Provider Usage">
      <section class="balance-card" aria-label="OpenChamber Custom Provider Usage">
        <div class="balance-head">
          <div class="balance-label" data-label>账户余额</div>
          <div class="balance-action" data-action></div>
        </div>
        <div class="balance-empty" data-empty hidden>
          <p class="balance-empty-text" data-empty-text>还没有添加中转站。</p>
          <div data-manage></div>
        </div>
        <ul class="site-list" data-sites hidden></ul>
        <div class="balance-issue" data-issue role="status">正在等待 OpenChamber 宿主…</div>
      </section>
    </main>
    <script src="main.js"></script>
  </body>
</html>
